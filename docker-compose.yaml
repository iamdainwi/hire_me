services:
  api:
    build: ./api
    image: hire_me_api:0.0.1
    ports:
      - '8000:8000'
    env_file:
      - ./api/.env
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB_USER=${POSTGRES_DB_USER}
      - POSTGRES_DB_PASSWORD=${POSTGRES_DB_PASSWORD}
      - POSTGRES_DB_NAME=${POSTGRES_DB_NAME}
    ports:
      - '5432:5433'
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
